[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-rw-ui-example"
version = "0.2.0"
requires-python = ">=3.11"
description = "RemoteWorkstations dependency API example"

[project.entry-points.endstone]
rw_ui_example = "endstone_rw_ui_example:RWUIExample"

[tool.setuptools.packages.find]
where = ["src"]
